name: Stage npm release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install npm CLI with staged publishing support
        run: |
          npm install --global 'npm@^11.15.0'
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag and package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match package.json version v$VERSION"
            exit 1
          fi
      - name: Run tests
        run: npm test
      - name: Check package tarball
        run: npm pack --dry-run
      - name: Stage package for npm approval
        run: npm stage publish
