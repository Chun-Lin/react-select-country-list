name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require master for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Select master when starting a release."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install npm CLI with staged publishing support
        run: |
          npm install --global 'npm@^11.15.0'
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Prepare version commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_INCREMENT: ${{ inputs.version }}
        run: |
          case "$VERSION_INCREMENT" in
            patch|minor|major) ;;
            *) echo "::error::Invalid version increment"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION_INCREMENT" --ignore-scripts --lockfile-version=1 -m "Release %s"
      - name: Verify release tag and package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match package.json version v$VERSION"
            exit 1
          fi
      - name: Run tests
        run: npm test
      - name: Check package tarball
        run: npm pack --dry-run
      - name: Push version commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git push --atomic origin HEAD:refs/heads/master "refs/tags/v$VERSION"
      - name: Stage package for npm approval
        run: npm stage publish
      - name: Explain final approval
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## Version $VERSION staged"
            echo "Open npm's Staged Packages tab and approve react-select-country-list@$VERSION with 2FA to publish it."
          } >> "$GITHUB_STEP_SUMMARY"
